<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepKit — Sleep Better, Wake Brighter</title>
<meta name="description" content="SleepKit plans your bedtime around 90-minute sleep cycles, logs your nights, tracks sleep debt and times the perfect power nap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#17100a; --night2:#211710; --panel:#2a1d12; --panel2:#332416;
  --paper:#f7efe3; --paper2:#efe3cf; --ink:#2a1c11; --ink2:#5d4a35;
  --amber:#e8a33d; --gold:#d9a441; --terra:#c96f3f; --bronze:#a67c52;
  --muted:#c9b8a3; --line:rgba(247,239,227,.14); --line-dark:rgba(42,28,17,.14);
  --good:#8fb573; --warn:#e8a33d; --bad:#d96a4a;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--paper);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;letter-spacing:-.01em}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--amber)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
.helper{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;background:var(--amber);color:#241505;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(232,163,61,.35)}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.danger{background:transparent;color:#f0a08a;border:1px solid rgba(217,106,74,.5)}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(247,239,227,.08);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
section{padding:44px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(26px,4vw,36px)}
.sec-head p{color:var(--muted);font-size:14px;max-width:520px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{font-size:20px;margin-bottom:6px}
.divider{height:1px;background:var(--line);margin:26px 0}
svg.ic{width:18px;height:18px;flex:none}
/* ---- intro ---- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 100% at 50% 0%,#3a2410 0%,#17100a 55%,#0e0805 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s,visibility .6s;overflow:hidden}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro .stars{position:absolute;inset:0}
#intro .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#ffe9bd;opacity:.7;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.25)}}
#intro .moon{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6dd,#e8c37a 60%,#c99a4a);box-shadow:0 0 60px 18px rgba(232,195,122,.35);margin-bottom:26px;animation:moonrise 1.1s ease both}
@keyframes moonrise{from{transform:translateY(26px) scale(.85);opacity:0}to{transform:none;opacity:1}}
#intro h1{font-size:clamp(44px,9vw,76px);color:var(--paper);animation:rise .8s .15s ease both}
#intro .tag{color:var(--muted);margin-top:10px;font-size:16px;animation:rise .8s .35s ease both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
#introBarWrap{width:min(280px,70vw);height:4px;background:rgba(247,239,227,.15);border-radius:99px;margin-top:34px;overflow:hidden;animation:rise .8s .5s ease both}
#introBar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--terra));border-radius:99px;transition:width .1s linear}
#skipIntro{position:absolute;bottom:26px;right:26px;background:rgba(247,239,227,.08);border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:10px 18px;font-weight:600;font-size:13px}
#intro.quick #introBarWrap{display:none}
/* @@NEXT@@ */
</style>
</head>
<body>
