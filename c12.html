<section id="windDown">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker">Tonight's routine</p>
        <h2>Wind down, same order, every night</h2>
        <p>A fixed routine is a signal to your brain: sleep is coming. Tick them off as you go — the ring fills up.</p>
      </div>
    </div>
    <div class="card wd-grid">
      <ul class="wd-list" id="wdList"></ul>
      <div class="ring-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
          <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(247,239,227,.12)" stroke-width="12"/>
          <circle id="wdRing" cx="75" cy="75" r="62" fill="none" stroke="#c96f3f" stroke-width="12" stroke-linecap="round" stroke-dasharray="389.5" stroke-dashoffset="194.75" transform="rotate(-90 75 75)"/>
        </svg>
        <div class="ring-num" id="wdNum">3 of 6</div>
        <div class="ring-lab">wind-down steps<br>done tonight</div>
      </div>
    </div>
  </div>
</section>
